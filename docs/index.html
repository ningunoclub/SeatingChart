<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeatingChart — Download</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
    }

    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 40px;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: -0.02em;
    }

    .tagline {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 28px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.1s ease, background 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .meta {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
      display: grid;
      gap: 12px;
      text-align: left;
      font-size: 0.95rem;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .meta-label {
      color: var(--muted);
      flex-shrink: 0;
    }

    .meta-value {
      font-weight: 500;
      text-align: right;
      word-break: break-word;
    }

    .releases-link {
      margin-top: 24px;
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .releases-link:hover {
      text-decoration: underline;
    }

    .error {
      margin-top: 24px;
      padding: 16px;
      border-radius: 10px;
      background: #fef2f2;
      color: var(--danger);
      font-size: 0.95rem;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 22px;
      }

      h1 {
        font-size: 1.65rem;
      }

      .meta-row {
        flex-direction: column;
        gap: 2px;
      }

      .meta-value {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">S</div>
    <h1>SeatingChart</h1>
    <p class="tagline">A lightweight, fully offline macOS app for generating random seating charts for school classes.</p>

    <a id="downloadBtn" class="btn btn-primary" href="https://github.com/ningunoclub/SeatingChart/releases/latest">
      <span class="spinner" id="btnSpinner" aria-hidden="true"></span>
      <span id="btnText">Loading latest release…</span>
    </a>

    <div id="meta" class="meta" style="display: none;">
      <div class="meta-row">
        <span class="meta-label">Version</span>
        <span class="meta-value" id="releaseTag">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Published</span>
        <span class="meta-value" id="releaseDate">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">File</span>
        <span class="meta-value" id="assetName">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Size</span>
        <span class="meta-value" id="assetSize">—</span>
      </div>
    </div>

    <div id="errorBox" class="error" style="display: none;"></div>

    <a class="releases-link" href="https://github.com/ningunoclub/SeatingChart/releases" target="_blank" rel="noopener">
      View all releases on GitHub →
    </a>
  </main>

  <script>
    const API_URL = 'https://api.github.com/repos/ningunoclub/SeatingChart/releases/latest';
    const FALLBACK_URL = 'https://github.com/ningunoclub/SeatingChart/releases/latest';
    const RELEASES_URL = 'https://github.com/ningunoclub/SeatingChart/releases';

    const downloadBtn = document.getElementById('downloadBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const meta = document.getElementById('meta');
    const releaseTag = document.getElementById('releaseTag');
    const releaseDate = document.getElementById('releaseDate');
    const assetName = document.getElementById('assetName');
    const assetSize = document.getElementById('assetSize');
    const errorBox = document.getElementById('errorBox');

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      const value = bytes / Math.pow(1024, i);
      return `${value.toFixed(i === 0 ? 0 : 2)} ${units[i]}`;
    }

    function formatDate(isoString) {
      if (!isoString) return '—';
      const date = new Date(isoString);
      return date.toLocaleDateString(undefined, {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function showError(message) {
      errorBox.style.display = 'block';
      errorBox.textContent = message;
    }

    function setDownloadingState() {
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Loading latest release…';
      downloadBtn.setAttribute('aria-busy', 'true');
    }

    function setReadyState(label, href) {
      btnSpinner.style.display = 'none';
      btnText.textContent = label;
      downloadBtn.href = href;
      downloadBtn.setAttribute('aria-busy', 'false');
    }

    async function loadLatestRelease() {
      setDownloadingState();

      try {
        const response = await fetch(API_URL);
        if (!response.ok) {
          throw new Error(`GitHub API returned ${response.status}`);
        }

        const release = await response.json();
        const assets = release.assets || [];
        const asset = assets.find(a => /^SeatingChart.*\.zip$/i.test(a.name)) || null;

        if (!asset) {
          setReadyState('View releases', RELEASES_URL);
          showError('No downloadable zip asset was found for the latest release. You can still browse all releases below.');
          if (release.tag_name) {
            releaseTag.textContent = release.tag_name;
          }
          if (release.published_at) {
            releaseDate.textContent = formatDate(release.published_at);
          }
          meta.style.display = 'grid';
          return;
        }

        setReadyState('Download latest release', asset.browser_download_url);

        releaseTag.textContent = release.tag_name || '—';
        releaseDate.textContent = formatDate(release.published_at);
        assetName.textContent = asset.name;
        assetSize.textContent = formatBytes(asset.size);
        meta.style.display = 'grid';
      } catch (err) {
        setReadyState('View releases', FALLBACK_URL);
        showError('Could not load the latest release automatically. Please use the button below to go to the releases page.');
        // eslint-disable-next-line no-console
        console.error('Failed to fetch latest release:', err);
      }
    }

    loadLatestRelease();
  </script>
</body>
</html>
